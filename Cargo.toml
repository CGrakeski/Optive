[package]
name = "optive"
version = "0.2.0"
edition = "2021"
description = "Optive programming language interpreter (Rust)"
license = "MIT"

[[bin]]
name = "Optive"
path = "src/main.rs"

[features]
default = ["mn"]
## M:N 真并行调度（work-stealing）。关闭时仍用 Arc 堆，但只跑 1 个 worker（协作语义）。
mn = []

[dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
rustc-hash = "2"
thiserror = "1"
regex = "1"
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
digest = "0.10"
hmac = "0.12"
gix = { version = "0.85", features = ["blocking-network-client", "worktree-mutation", "blocking-http-transport-reqwest-rust-tls"] }
reqwest = { version = "0.11", features = ["rustls-tls-native-roots", "blocking"] }
indicatif = "0"
log = "0.4.33"
libloading = "0.8"
libffi = "3.2"
toml = "0.8"
toml_edit = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rustyline = { version = "15", features = ["derive"] }
base64 = "0.22"
flate2 = "1"
serde_yaml = "0.9"
roxmltree = "0.20"
csv = "1"
parking_lot = "0.12"
crossbeam-deque = "0.8"
crossbeam-channel = "0.5"
num_cpus = "1"

[dev-dependencies]
pretty_assertions = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "optive"
harness = false
path = "benches/optive.rs"

[profile.release]
lto = "thin"
codegen-units = 4
debug-assertions = false
overflow-checks = true

[profile.bench]
inherits = "release"
