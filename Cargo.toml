[package]
name = "optive"
version = "0.2.0"
edition = "2021"
description = "Optive programming language interpreter (Rust)"
license = "MulanPSL-2.0"

[[bin]]
name = "Optive"
path = "src/main.rs"

## CPU 分析负载入口（配合 samply 等外部采样器）。不引入库依赖，改动面最小。
[[bin]]
name = "benchmark-analysis"
path = "src/bin/benchmark-analysis.rs"

[[bin]]
name = "gc-baseline"
path = "src/bin/gc-baseline.rs"

[[bin]]
name = "gc-mode-compare"
path = "src/bin/gc-mode-compare.rs"

[features]
default = ["mn"]
## M:N 真并行调度（work-stealing）。关闭时仍用 Arc 堆，但只跑 1 个 worker（协作语义）。
mn = []

[dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
rustc-hash = "2"
thiserror = "1"
regex = "1"
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
digest = "0.10"
hmac = "0.12"
gix = { version = "0.85", features = ["blocking-network-client", "worktree-mutation", "blocking-http-transport-reqwest-rust-tls"] }
reqwest = { version = "0.11", features = ["rustls-tls-native-roots", "blocking"] }
indicatif = "0"
libloading = "0.8"
libffi = "3.2"
toml = "0.8"
toml_edit = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rustyline = { version = "15", features = ["derive"] }
base64 = "0.22"
flate2 = "1"
serde_yaml = "0.9"
roxmltree = "0.20"
csv = "1"
parking_lot = "0.12"
crossbeam-deque = "0.8"
num_cpus = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "optive"
harness = false
path = "benches/optive.rs"

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
debug-assertions = false
overflow-checks = true

## 保留符号，供 samply / ETW 采样定位函数热点。
[profile.profiling]
inherits = "release"
debug = 1
strip = false
codegen-units = 1

[profile.bench]
inherits = "release"
