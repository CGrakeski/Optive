[package]
name = "optive"
version = "0.2.0"
edition = "2021"
description = "Optive programming language interpreter (Rust)"
license = "MulanPSL-2.0"

[[bin]]
name = "Optive"
path = "src/main.rs"

## CPU 分析负载入口（配合 samply 等外部采样器）。不引入库依赖，改动面最小。
[[bin]]
name = "benchmark-analysis"
path = "src/bin/benchmark-analysis.rs"

[[bin]]
name = "gc-baseline"
path = "src/bin/gc-baseline.rs"

[[bin]]
name = "gc-mode-compare"
path = "src/bin/gc-mode-compare.rs"

[features]
default = ["mn"]
## M:N 真并行调度（work-stealing）。关闭时仍用 Arc 堆，但只跑 1 个 worker（协作语义）。
mn = []

[dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
rustc-hash = "2"
thiserror = "1"
regex = "1"
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
digest = "0.10"
hmac = "0.12"
gix = { version = "0.85", features = ["blocking-network-client", "worktree-mutation", "blocking-http-transport-reqwest-rust-tls"] }
reqwest = { version = "0.11", features = ["rustls-tls-native-roots", "blocking"] }
indicatif = "0"
libloading = "0.8"
libffi = "3.2"
toml = "0.8"
toml_edit = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rustyline = { version = "15", features = ["derive"] }
base64 = "0.22"
flate2 = "1"
serde_yaml = "0.9"
roxmltree = "0.20"
csv = "1"
parking_lot = "0.12"
crossbeam-deque = "0.8"
num_cpus = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "optive"
harness = false
path = "benches/optive.rs"

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
debug-assertions = false
overflow-checks = true

## 保留符号，供 samply / ETW 采样定位函数热点。
[profile.profiling]
inherits = "release"
debug = 1
strip = false
codegen-units = 1

[profile.bench]
inherits = "release"

## 仅保留 VM/解释器场景下改不动或改了无收益的噪音。
## 变量名、无用 self、&Option、unnecessary_wraps、assigning_clones 等必须改代码，不放这里。
[lints.clippy]
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_long_first_doc_paragraph = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
too_many_lines = "allow"
match_same_arms = "allow"
branches_sharing_code = "allow"
significant_drop_tightening = "allow"
significant_drop_in_scrutinee = "allow"
items_after_statements = "allow"
format_push_string = "allow"
implicit_hasher = "allow"
zero_sized_map_values = "allow"
inline_always = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
non_send_fields_in_send_ty = "allow"
literal_string_with_formatting_args = "allow"
case_sensitive_file_extension_comparisons = "allow"
unreadable_literal = "allow"
cognitive_complexity = "allow"
doc_markdown = "allow"
module_name_repetitions = "allow"
wildcard_imports = "allow"
option_option = "allow"
or_fun_call = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
trivially_copy_pass_by_ref = "allow"
wildcard_enum_match_arm = "allow"
match_wildcard_for_single_variants = "allow"
comparison_chain = "allow"
manual_let_else = "allow"
useless_let_if_seq = "allow"
needless_continue = "allow"
unused_peekable = "allow"
used_underscore_binding = "allow"
map_unwrap_or = "allow"
redundant_clone = "allow"
# 大面积风格重写收益有限
option_if_let_else = "allow"
needless_pass_by_value = "allow"
needless_pass_by_ref_mut = "allow"
