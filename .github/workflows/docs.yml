name: Docs

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_book: ${{ steps.book.outputs.has_book }}
    steps:
      - uses: actions/checkout@v5
      - id: book
        run: |
          if [ -f docs/book.toml ]; then
            echo "has_book=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_book=false" >> "$GITHUB_OUTPUT"
          fi
      - name: mdBook
        if: steps.book.outputs.has_book == 'true'
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.4.40"
      - name: Build book
        if: steps.book.outputs.has_book == 'true'
        run: mdbook build docs
      - uses: actions/upload-artifact@v7
        if: steps.book.outputs.has_book == 'true'
        with:
          name: book
          path: target/book
          if-no-files-found: error
          retention-days: 7

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check.outputs.has_book == 'true'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: book
          path: target/book
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/book
      - id: deploy
        uses: actions/deploy-pages@v5
