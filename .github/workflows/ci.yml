name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
  schedule:
    # 可选 nightly：concurrent GC 正确性（不改默认模式）
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # CI 缓存 target/ 时增量产物又大又容易失效；关掉后依赖库命中缓存即可。
  CARGO_INCREMENTAL: "0"
  # 缩小 debug 产物，避免 ubuntu-latest ~14GB 在 rust-cache 收尾时写满磁盘。
  CARGO_PROFILE_DEV_DEBUG: "1"
  # gix 写 reflog 需要身份；Windows runner 常未配 user.name。
  GIT_AUTHOR_NAME: Optive CI
  GIT_AUTHOR_EMAIL: ci@optive.invalid
  GIT_COMMITTER_NAME: Optive CI
  GIT_COMMITTER_EMAIL: ci@optive.invalid
  # 避免 Xcode 把 min version 设成 runner 的 26.x，旧 libffi 汇编会编不过。
  MACOSX_DEPLOYMENT_TARGET: "14.0"

# 取消同分支上被取代的旧运行，节省 CI 分钟。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 编译策略（避免「每个 job / 每个 step 全量重编」）：
# - rust-cache 默认 key 含 job id，lint / test / release 的 ~/.cargo 与依赖 rlib 互不命中。
#   同类 job 用 shared-key；clippy-driver 与 rustc 的 target/ 不兼容，禁止混用一把钥匙。
# - 不要 cache-on-failure：失败后磁盘已紧，post 里 cargo metadata 再下 crate 会 ENOSPC。
# - clippy 后再 cargo build 会换编译器再编一遍依赖；二进制自检放到 test job。
# - cargo test 会编 lib / bin / 集成测试；前面再 cargo build --bin Optive 是重复的。
# - concurrent GC 只改运行时 env，与默认测试共用 debug 产物，不再单独起 runner。

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/share/swift /usr/local/.ghcup /usr/local/share/boost \
            /usr/share/miniconda /opt/microsoft/msedge 2>/dev/null || true
          sudo docker system prune -af --volumes >/dev/null 2>&1 || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      - name: rustfmt check
        run: cargo fmt --all -- --check
      - name: clippy (all targets and features, deny warnings)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  # 三平台构建 + 测试。集成测试会 spawn 已构建的 `Optive` 二进制，
  # `cargo test` 默认会先编译 bin，故无需额外 `cargo build`。
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/share/swift /usr/local/.ghcup /usr/local/share/boost \
            /usr/share/miniconda /opt/microsoft/msedge 2>/dev/null || true
          sudo docker system prune -af --volumes >/dev/null 2>&1 || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - name: Fetch locked crates
        run: cargo fetch --locked
      - name: Test (default — 跳过被 ignore 的慢基准；含 vm_concurrency / vm_gc_mn / fuzz_frontend)
        run: cargo test --locked --all-features
      - name: Test (ignored 基准，仅作冒烟)
        # 慢的 fib(30) 等；CI 上只验证能跑通，不读性能数据。产物已在上一步编好。
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked --all-features -- --ignored
      - name: GC correctness under concurrent mode
        if: matrix.os == 'ubuntu-latest'
        env:
          OPTIVE_GC_MODE: concurrent
        run: |
          cargo test --locked --test vm_gc_mn
          cargo test --locked --test vm_gc_mode_compare -- --skip compare_stw_vs_concurrent
      - name: Optive check, test, and fmt self-check
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          OPTIVE_HOME: ${{ runner.temp }}/optive-home
          OPTIVE_CUSTOM: en-US
        run: |
          set -euo pipefail
          source_fixture=.github/fixtures/optive-self-check
          fixture="$RUNNER_TEMP/optive-self-check"
          optive=target/debug/Optive
          mkdir -p "$OPTIVE_HOME"
          cp -R "$source_fixture" "$fixture"
          "$optive" check "$fixture"
          "$optive" test "$fixture"
          formatted="$fixture/src/main.tive"
          second_pass="$RUNNER_TEMP/optive-fmt-self-check.second.tive"
          "$optive" fmt "$formatted"
          "$optive" fmt "$formatted" --out > "$second_pass"
          cmp "$formatted" "$second_pass"
          "$optive" fmt --check "$fixture"

  # release 构建冒烟：确保 release profile（LTO + overflow-checks）也能编译通过并运行。
  # 与 debug 不同 profile，必须另编；shared-key 只复用同类 release 依赖缓存。
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/share/swift /usr/local/.ghcup /usr/local/share/boost \
            /usr/share/miniconda /opt/microsoft/msedge 2>/dev/null || true
          sudo docker system prune -af --volumes >/dev/null 2>&1 || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - name: Build (release)
        run: cargo build --locked --release --bin Optive
      - name: Smoke run
        run: ./target/release/Optive -V

  # 依赖漏洞扫描（RustSec advisory DB）。
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit

  # CycloneDX SBOM + 显式许可证白名单；两者都以已提交 Cargo.lock 为输入。
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: metadata
          cache-targets: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-cyclonedx
      - name: Verify locked dependency graph
        run: cargo metadata --locked --format-version 1 --no-deps
      - name: Check dependency licenses
        run: cargo deny --locked --all-features check licenses
      - name: Generate CycloneDX SBOM
        run: cargo cyclonedx --format json --all-features --target all --spec-version 1.5 --override-filename optive.cdx
      - name: Verify SBOM and unchanged lockfile
        run: |
          python3 -m json.tool optive.cdx.json >/dev/null
          git diff --exit-code -- Cargo.lock
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: optive-cyclonedx-sbom
          path: optive.cdx.json
          if-no-files-found: error
          retention-days: 30
